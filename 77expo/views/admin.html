<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pannello admin — 77 EXPOSED</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="brand">77<span class="dot">.</span>EXPOSED</div>
      <nav class="nav">
        <a href="/">feed</a>
        <a href="/official-member">official member</a>
        <a href="#" id="logout-link">esci</a>
      </nav>
    </div>

    <section class="hero">
      <div class="numeral">77</div>
      <p class="eyebrow">Sessione attiva</p>
      <h1>PANNELLO <span class="accent">ADMIN</span></h1>
      <p class="sub">Gestisci i membri ufficiali e pubblica nuovi post a loro nome.</p>
    </section>

    <!-- ===== gestione membri ===== -->
    <div class="section-label" style="margin-top:40px">official member</div>
    <div class="admin-grid">
      <div class="panel">
        <div class="panel-head"><span class="panel-title">nuovo membro</span></div>
        <div class="panel-body">
          <form id="member-form">
            <div class="field">
              <label for="m-username">username</label>
              <input id="m-username" name="username" type="text" maxlength="40" required />
            </div>
            <div class="field">
              <label for="m-photo">logo personale (opzionale)</label>
              <input id="m-photo" name="photo" type="file" accept="image/png,image/jpeg,image/webp,image/gif" />
            </div>
            <button class="btn" type="submit" style="width:100%">aggiungi membro</button>
            <div id="member-msg" class="msg"></div>
          </form>
        </div>
      </div>

      <div>
        <div id="member-list"></div>
      </div>
    </div>

    <!-- ===== pubblicazione post ===== -->
    <div class="section-label">nuovo post</div>
    <div class="admin-grid">
      <div class="panel">
        <div class="panel-head"><span class="panel-title">pubblica</span></div>
        <div class="panel-body">
          <form id="paste-form">
            <div class="field">
              <label for="title">titolo</label>
              <input id="title" name="title" type="text" maxlength="120" required />
            </div>
            <div class="field">
              <label>autore/i</label>
              <div id="author-picker" class="author-picker">
                <span class="hint" style="margin:0">nessun membro disponibile</span>
              </div>
            </div>
            <div class="field">
              <label for="content">contenuto</label>
              <textarea id="content" name="content" required></textarea>
            </div>
            <button class="btn" type="submit" style="width:100%">pubblica</button>
            <div id="form-msg" class="msg"></div>
          </form>
        </div>
      </div>

      <div>
        <div class="section-label" style="margin-top:0">post pubblicati</div>
        <div id="admin-list"></div>
      </div>
    </div>

    <footer>77 EXPOSED — sputtaniamo coglioni</footer>
  </div>

  <script src="/js/admin.js"></script>
</body>
</html>
